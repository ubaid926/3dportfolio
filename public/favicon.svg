<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e4eb" />
      <stop offset="50%" stop-color="#8a94a6" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="chromeGradDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070709" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  
  <!-- Stylized Metallic 'N' for Nexora -->
  <g filter="url(#glow)">
    <!-- Left vertical bar with angled cut -->
    <path d="M16 48 L16 16 L23 16 L23 38 L16 48 Z" fill="url(#chromeGradDark)" />
    <!-- Diagonal stroke crossing across -->
    <polygon points="17,16 27,16 47,48 37,48" fill="url(#chromeGrad)" />
    <!-- Right vertical bar -->
    <path d="M41 16 L48 16 L48 48 L41 48 L41 26 Z" fill="url(#chromeGradDark)" />
  </g>
</svg>
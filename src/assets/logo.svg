<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" fill="none">
  <defs>
    <!-- Ultra-realistic Chrome Gradients -->
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="chromeDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#64748b" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="chromeEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Monogram Emblem 'N' on the left -->
  <g transform="translate(10, 4) scale(1.18)" filter="url(#softGlow)">
    <!-- Left vertical bar with angled bottom facet -->
    <path d="M 8,4 L 17,4 L 17,38 L 8,48 Z" fill="url(#chromeDark)" stroke="url(#chromeEdge)" stroke-width="0.5" />
    <path d="M 12,4 L 17,4 L 17,38 L 12,43 Z" fill="url(#chromeLight)" opacity="0.85" />

    <!-- Sharp Diagonal Cross-bar -->
    <polygon points="10,4 21,4 43,48 32,48" fill="url(#chromeLight)" stroke="url(#chromeEdge)" stroke-width="0.5" />
    <polygon points="16,4 21,4 43,48 38,48" fill="url(#chromeDark)" opacity="0.65" />

    <!-- Right vertical bar with angled top facet -->
    <path d="M 34,14 L 43,4 L 43,48 L 34,48 Z" fill="url(#chromeDark)" stroke="url(#chromeEdge)" stroke-width="0.5" />
    <path d="M 34,14 L 39,9 L 39,48 L 34,48 Z" fill="url(#chromeLight)" opacity="0.85" />
  </g>

  <!-- NEXORA STUDIO Luxury Typography on the right -->
  <g transform="translate(74, 10)">
    <!-- "N E X O R A" -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', 'Outfit', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="url(#textChrome)" filter="url(#softGlow)">NEXORA</text>
    
    <!-- Subtitle: "— STUDIO —" -->
    <g transform="translate(0, 47)">
      <line x1="0" y1="-5" x2="32" y2="-5" stroke="url(#chromeEdge)" stroke-width="1.2" opacity="0.7" />
      <text x="42" y="0" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="11.5" font-weight="500" letter-spacing="7" fill="#cbd5e1">STUDIO</text>
      <line x1="142" y1="-5" x2="174" y2="-5" stroke="url(#chromeEdge)" stroke-width="1.2" opacity="0.7" />
    </g>
  </g>
</svg>
